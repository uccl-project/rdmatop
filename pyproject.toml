[build-system]
requires = ["setuptools>=77", "torch>=2.9"]
build-backend = "setuptools.build_meta"

[project]
name = "rdmatop"
dynamic = ["version", "dependencies"]
description = "RDMA terminal monitor and PyTorch profiler counter tracks"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = ["Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3", "Programming Language :: Rust"]

[project.urls]
Homepage = "https://github.com/uccl-project/rdmatop"
Issues = "https://github.com/uccl-project/rdmatop/issues"

[project.scripts]
rdmatop = "rdmatop._cli:main"

[tool.setuptools]
packages = ["rdmatop"]
package-dir = {"" = "python"}
