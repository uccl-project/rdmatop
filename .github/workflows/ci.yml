name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cargo test
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings

  kineto:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        torch: ["2.9.0", "2.10.0", "2.11.0", "2.12.0", "2.13.0", "2.14.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install "setuptools>=77" wheel ninja numpy pytest "viztracer>=1.1.1"
      - run: python -m pip install "torch==${{ matrix.torch }}" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install --no-build-isolation --no-deps .
      - run: rdmatop --help
      - run: python -m pytest python/tests -q
