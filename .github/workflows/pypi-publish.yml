name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "pyproject.toml"
      - "setup.py"
      - "MANIFEST.in"
      - "python/**"
      - "src/**"
      - "kineto/**"
      - "Cargo.toml"
      - ".github/workflows/pypi-publish.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          if os.environ["TAG_NAME"] != f"v{version}":
              raise SystemExit("Release tag must match Cargo.toml version")
          PY
      - run: python -m pip install build twine "setuptools>=77" wheel numpy
      - run: python -m pip install "torch==2.9.0" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m build --sdist --no-isolation
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: pypi-source
          path: dist/*.tar.gz
          if-no-files-found: error

  validate:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        torch: ["2.9.0", "2.14.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v8
        with:
          name: pypi-source
          path: dist
      - run: python -m pip install "setuptools>=77" wheel ninja numpy pytest "viztracer>=1.1.1"
      - run: python -m pip install "torch==${{ matrix.torch }}" --index-url https://download.pytorch.org/whl/cpu
      - name: Install the source archive outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -m pip install --no-build-isolation --no-deps "$GITHUB_WORKSPACE"/dist/*.tar.gz
      - name: Verify installed terminal command and profiler
        working-directory: ${{ runner.temp }}
        run: |
          rdmatop --help
          python -c 'import rdmatop; rdmatop.enable()'
          python -m pytest "$GITHUB_WORKSPACE/python/tests" -q

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, validate]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rdmatop
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pypi-source
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
