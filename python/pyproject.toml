[build-system]
requires = ["setuptools>=64", "torch>=2.9"]
build-backend = "setuptools.build_meta"

[project]
name = "rdmatop"
dynamic = ["version"]
description = "RDMA counter tracks inside the PyTorch profiler trace"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["torch>=2.9"]

[tool.setuptools]
packages = ["rdmatop"]
